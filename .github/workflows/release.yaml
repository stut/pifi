name: release

on:
  release:
    types: [published]

permissions:
    contents: write

jobs:
  release:
    name: release linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
          # ARMv6 covers the Pi Zero W and every other 32-bit Pi OS install.
          - goarch: arm
            goarm: "6"
    steps:
    - uses: actions/checkout@v4
    - name: Validate release tag
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9.+_-]*$ ]]; then
          echo "Release tags must contain only letters, digits, dots, plus signs, underscores or hyphens."
          exit 1
        fi
    - uses: wangyoucao577/go-release-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: linux
        goarch: ${{ matrix.goarch }}
        goarm: ${{ matrix.goarm }}
        project_path: "./cmd/pifi"
        # Keep the runner's build paths out of log lines.
        build_flags: -trimpath
        ldflags: -s -w -X main.version=${{ github.event.release.tag_name }}
        binary_name: "pifi"
        md5sum: false
        sha256sum: true
        extra_files: LICENSE README.md SECURITY.md
